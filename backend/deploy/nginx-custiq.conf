# Nginx site for CustIQ: serves the built React frontend and proxies /api → API.
# Copy to /etc/nginx/sites-available/custiq, symlink into sites-enabled,
# edit server_name, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Frontend talks to the API at the same origin under /api (so set the UI's
# VITE_API_BASE to "/api" at build time — no CORS needed, same origin).

server {
    listen 80;
    server_name _;  # replace with your domain or public IP

    # Built frontend (dist/ copied here).
    root /var/www/custiq;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. The trailing slash on both sides strips the /api prefix
    # so FastAPI sees /score, /ask, etc.
    location /api/ {
        proxy_pass http://127.0.0.1:8300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 6M;  # matches the 5 MB upload cap with headroom
}
