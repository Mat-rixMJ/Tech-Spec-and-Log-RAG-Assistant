# Render Blueprint for the CustIQ API (free tier).
services:
  - type: web
    name: custiq-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: LLM_PROVIDER
        value: "gemini"
      # Paste your Gemini key in the Render dashboard (secret).
      - key: GEMINI_API_KEY
        sync: false
      # Set to your Netlify frontend URL after first deploy.
      - key: CUSTIQ_CORS_ORIGINS
        sync: false
